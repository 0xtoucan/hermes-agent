name: Windows venv-holder live E2E

# ON-DEMAND ONLY (fleet-update #91277, venv-holder consolidation work).
#
# Runs the live venv-holder E2E suite on a real windows-latest runner:
# spawns actual processes with realistic Hermes argv shapes and drives the
# REAL detection/classification/exemption code against the live process
# table — the coverage that cannot exist on the Linux lanes and that the
# maintainer cannot exercise locally before the work reaches main.
#
# Deliberately NOT wired to pull_request/main: it fires only on pushes to
# wine2e/** working branches, so it costs nothing on normal PRs. Delete or
# keep dormant after the venv-holder work lands.

on:
  push:
    branches:
      - "wine2e/**"

permissions:
  contents: read

concurrency:
  group: windows-venv-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  venv-holder-e2e:
    name: venv-holder live E2E (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev --extra messaging

      - name: "#115578 receipt: zombie-probe cost + snapshot lock hold on real Windows"
        shell: bash
        run: |
          set -uo pipefail
          uv run --no-sync python - <<'PY'
          import os, statistics, sys, time, tempfile, pathlib
          sys.path.insert(0, os.getcwd())
          from gateway import status
          import psutil
          calls = []
          real = psutil.Process.status
          def spy(self):
              calls.append(self.pid); return real(self)
          psutil.Process.status = spy
          t = []
          for _ in range(50):
              s = time.perf_counter(); status._pid_exists(os.getpid()); t.append((time.perf_counter() - s) * 1000)
          psutil.Process.status = real
          print(f"RECEIPT _pid_exists median={statistics.median(t):.3f}ms status_probe_calls={len(calls)}")
          home = pathlib.Path(tempfile.mkdtemp()) / "hermes"
          (home / "runtime").mkdir(parents=True)
          from hermes_cli import active_sessions as a
          entries = [{"lease_id": f"l{i}", "session_id": f"s{i}", "pid": os.getpid()} for i in range(13)]
          a._write_entries(home / "runtime" / "active_sessions.json", entries)
          held = []
          real_lock = a._FileLock
          class Timed(real_lock):
              def __enter__(self):
                  r = super().__enter__(); self._t0 = time.perf_counter(); return r
              def __exit__(self, *e):
                  held.append((time.perf_counter() - self._t0) * 1000); return super().__exit__(*e)
          a._FileLock = Timed
          for _ in range(12):
              a.active_session_registry_snapshot(registry_home=home)
          print(f"RECEIPT snapshot(13 leases) lock hold median={statistics.median(held):.2f}ms max={max(held):.2f}ms")
          PY

      - name: "#115578 receipt: tests"
        shell: bash
        run: |
          set -uo pipefail
          uv run --no-sync python -m pytest \
            tests/gateway/test_status.py tests/hermes_cli/test_active_sessions.py \
            -k "TestPidExistsZombieProbe or test_snapshot_prunes_after_lock_release" \
            -o addopts= -v -p no:cacheprovider -rA
